; ── PHP Production Config ──────────────────────────────────
; Optimized for: 4 CPU / 7.5 GB RAM server
;
; OPcache: maximized for production (no timestamp checks)
; Memory: 512M per-process (headroom for Filament + Livewire)
; Execution: 60s hard limit (matches FPM request_terminate_timeout)

; ── OPcache (maximized) ──
opcache.enable=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.save_comments=1
opcache.jit=1255
opcache.jit_buffer_size=128M

; ── Security ──
expose_php=Off

; ── Limits ──
memory_limit=512M
upload_max_filesize=64M
post_max_size=64M
max_execution_time=60
max_input_time=60
max_input_vars=5000

; ── Realpath cache (reduces stat() calls) ──
realpath_cache_size=4096K
realpath_cache_ttl=600

; ── Session ──
session.gc_maxlifetime=7200
