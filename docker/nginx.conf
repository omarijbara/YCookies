# ── Nginx — Optimized for 4 CPU / 7.5 GB server ──────────
# Sits inside the Laravel container, reverse-proxying to PHP-FPM

worker_processes auto;           # = 4 workers (one per CPU core)
worker_rlimit_nofile 8192;       # max open files per worker

events {
    worker_connections 2048;      # max concurrent connections per worker
    multi_accept on;              # accept all pending connections at once
    use epoll;                    # Linux-optimized event model
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Performance ──
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;

    # ── Buffers (sized for Filament/Livewire responses) ──
    client_body_buffer_size 16K;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;
    output_buffers 2 32k;

    # ── FastCGI tuning ──
    fastcgi_buffer_size 32k;
    fastcgi_buffers 16 16k;
    fastcgi_busy_buffers_size 64k;
    fastcgi_read_timeout 60s;

    # ── Logging (minimal for performance) ──
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # ── Compression ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ── File upload limit ──
    client_max_body_size 64M;

    server {
        listen 80;
        server_name _;
        root /app/public;
        index index.php;

        # ── Security ──
        server_tokens off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_hide_header X-Powered-By;
        }

        # Block dotfiles (except .well-known for Let's Encrypt)
        location ~ /\.(?!well-known).* {
            deny all;
        }

        # Health check — no access log noise
        location = /up {
            access_log off;
            try_files $uri /index.php?$query_string;
        }

        # Static assets — long cache + try_files for dynamic .js routes
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
            try_files $uri /index.php?$query_string;
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header 'Access-Control-Allow-Origin' '*' always;
            access_log off;
        }
    }
}
