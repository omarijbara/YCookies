[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000

; ── Pool sizing ──────────────────────────────────────────
; Server: 4 CPU cores, 7.5 GB RAM
; Other services consume ~2.3 GB, leaving ~5 GB for Laravel
; Each PHP-FPM child uses ~40-60 MB → 40 children ≈ 2.4 GB max
; OS + buffers need ~1 GB headroom
;
pm = dynamic
pm.max_children = 40
pm.start_servers = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 16
pm.max_requests = 500

; ── Safety: kill stuck workers after 60s ─────────────────
; Prevents a single hung request (e.g. pulse:check, slow DB)
; from permanently occupying a worker slot.
request_terminate_timeout = 60s

; ── Slow log for debugging ───────────────────────────────
slowlog = /proc/self/fd/2
request_slowlog_timeout = 10s
