name: Publish Docker Images

# Builds and pushes the three YCookies images to Docker Hub:
#   <namespace>/ycookies          — Laravel control plane (nginx + php-fpm + scheduler)
#   <namespace>/ycookies-scanner  — same image + Chromium/Puppeteer (scanner queue worker)
#   <namespace>/ycookies-proxy    — Node/Fastify consent reverse proxy (data plane)
#
# Required repository secrets:
#   DOCKERHUB_USERNAME — Docker Hub username (also used as the image namespace)
#   DOCKERHUB_TOKEN    — Docker Hub access token with Read/Write scope
#                        (hub.docker.com → Account Settings → Personal access tokens)
#
# Triggers:
#   - Version tags (v1.2.3) → :1.2.3, :1.2, :latest
#   - Manual dispatch       → :edge (for testing the pipeline before a release)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ycookies
            context: .
            dockerfile: Dockerfile.laravel
            target: production
          - name: ycookies-scanner
            context: .
            dockerfile: Dockerfile.laravel
            target: scanner
          - name: ycookies-proxy
            context: ./services/proxy
            dockerfile: ./services/proxy/Dockerfile
            target: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.name }}
            org.opencontainers.image.description=YCookies — self-hosted enterprise cookie consent manager
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
