name: Deploy Gate

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'CHANGELOG*'
      - 'CONTRIBUTING*'
  pull_request:
    branches: [main]

jobs:
  test:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, curl, libxml, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, readline, fileinfo
          coverage: none

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm install

      - name: Setup Environment
        run: |
          php -r "file_exists('.env') || copy('.env.example', '.env');"
          php artisan key:generate
          chmod -R 777 storage bootstrap/cache

      - name: PHPUnit Tests
        run: php artisan test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: Vitest (frontend unit)
        run: npm run test:unit

      - name: Proxy Node tests
        working-directory: services/proxy
        run: npm ci && npm test

      - name: Boot Network Daemons
        run: |
          # Boot Laravel Backend
          php artisan serve --port=8001 &
          
          # Boot Node Proxy Engine
          cd services/proxy && npm start &
          
          # Wait for daemons
          sleep 5

      - name: K6 Load Testing
        continue-on-error: true # Just a baseline check, don't block deploys for it
        uses: grafana/k6-action@v0.3.1
        with:
          filename: services/proxy/test/k6-load-suite.js
        env:
          TARGET_URL: http://localhost:3000

      - name: Dusk E2E Tests
        run: |
          php artisan dusk --env=testing || true

      - name: Lighthouse CI
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:8001/
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:8001/'
          fail_action: true
          # Only fail the pipeline if HIGH severity issues are detected
          # Exclude missing anti-clickjacking headers or obscure medium-grade config misses
          cmd_options: '-z "-config alert.fatal=High"'

  deploy:
    name: Deployment
    needs: [test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Environment
        id: env-check
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "env=staging" >> $GITHUB_OUTPUT
            echo "uuid=${{ secrets.COOLIFY_APP_UUID_STAGING }}" >> $GITHUB_OUTPUT
          else
            echo "env=production" >> $GITHUB_OUTPUT
            echo "uuid=${{ secrets.COOLIFY_APP_UUID_PROD }}" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Coolify
        if: steps.env-check.outputs.uuid != ''
        env:
          COOLIFY_API_BASE: ${{ secrets.COOLIFY_API_BASE }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          BASE="${COOLIFY_API_BASE:-https://coolify.revyome.com}"
          curl -s -X GET "$BASE/api/v1/deploy?uuid=${{ steps.env-check.outputs.uuid }}&force=true" \
               -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
               -H "Content-Type: application/json"
          echo "Deployment triggered for ${{ steps.env-check.outputs.env }} (${{ steps.env-check.outputs.uuid }})"
